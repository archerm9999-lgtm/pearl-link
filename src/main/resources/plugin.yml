name: PearlLink
version: '${project.version}'
main: dev.pearllink.PearlLinkPlugin
api-version: '1.21.11'
description: Pearl Rod and Orbital Rod - link a rod to an ender pearl and pull it remotely.
author: potato_lord8916
commands:
  pearlrod:
    description: Give a Pearl Rod or Orbital Rod
    usage: /pearlrod give [pearl|orbital] [player]
    permission: pearllink.admin
permissions:
  pearllink.admin:
    description: Use /pearlrod and link pearls thrown by other players
    default: op
