name: Build PearlLink
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Verify jar contents
        run: |
          unzip -l target/pearl-link-*.jar
          unzip -l target/pearl-link-*.jar | grep -q ' plugin.yml$'
          unzip -l target/pearl-link-*.jar | grep -q 'dev/pearllink/PearlLinkPlugin.class'
      - uses: actions/upload-artifact@v4
        with:
          name: PearlLink-jar
          path: target/pearl-link-*.jar
